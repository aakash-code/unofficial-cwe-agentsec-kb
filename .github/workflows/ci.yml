name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate knowledge base and CWE data pack
        run: python tools/agentsec.py validate
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build and install the package
        run: |
          python -m pip install .
          agentsec cwe-status
